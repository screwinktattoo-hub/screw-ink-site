<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Screw_ink — Flash</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
  <h1>Screw_ink</h1>
  <p>Flash available — book directly</p>

  <div class="header-buttons">
    <a href="booking.html" target="_blank" class="book-btn">
      Book flash
    </a>
    <a href="https://tally.so/r/nrgLG5" target="_blank" class="custom-btn">
      Custom projects
    </a>
  </div>
</header>
  
  <main>
    <div id="flash-container" class="flash-grid"></div>
  </main>

  <!-- IMAGE MODAL -->
  <div id="image-modal" class="modal">
    <span class="close">&times;</span>
    <img class="modal-img" id="modal-img">
  </div>

  <script>
    fetch("./flash.json")
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById("flash-container");

        data.forEach(flash => {
          const card = document.createElement("div");
          card.className = "flash-card";

          const img = document.createElement("img");
          img.src = `./flash/${flash.image}`;
          img.alt = flash.name;
          img.className = "flash-img";

          // CLICK IMAGE TO ENLARGE
          img.addEventListener("click", () => {
            document.getElementById("modal-img").src = img.src;
            document.getElementById("image-modal").style.display = "flex";
          });

          const info = document.createElement("div");
          info.className = "flash-info";
          info.innerHTML = `
            <h3>${flash.name}</h3>
            <p>${flash.size}</p>
            <p>${flash.price}</p>
            <p class="status">${flash.status}</p>
            <a href="booking.html" target="_blank" class="book-btn">
              Book this flash
            </a>
          `;

          card.appendChild(img);
          card.appendChild(info);
          container.appendChild(card);
        });
      })
      .catch(err => {
        console.error("Flash load error:", err);
      });

    // CLOSE MODAL
    const modal = document.getElementById("image-modal");
    const closeBtn = document.querySelector(".close");

    closeBtn.onclick = () => modal.style.display = "none";
    modal.onclick = e => {
      if (e.target === modal) modal.style.display = "none";
    };
  </script>

</body>
</html>
