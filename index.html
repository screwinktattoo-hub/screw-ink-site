<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Screw_ink — Flash</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Screw_ink</h1>
    <p>Flash available — book directly</p>
  </header>

  <main>
    <div id="flash-container" class="flash-grid"></div>
  </main>

  <script>
    fetch("./flash.json")
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById("flash-container");

        data.forEach(flash => {
          const card = document.createElement("div");
          card.className = "flash-card";

          const img = document.createElement("img");
          img.src = `./flash/${flash.image}`;
          img.alt = flash.name;

          const info = document.createElement("div");
info.className = "flash-info";
info.innerHTML = `
  <h3>${flash.name}</h3>
  <p>${flash.size}</p>
  <p>${flash.price}</p>
  <p class="status">${flash.status}</p>
  <a 
    href="booking.html" 
    target="_blank" 
    class="book-btn">
    Book this flash
  </a>
`;
          card.appendChild(img);
          card.appendChild(info);
          container.appendChild(card);
        });
      })
      .catch(err => {
        console.error("Flash load error:", err);
      });
  </script>

</body>
</html>
