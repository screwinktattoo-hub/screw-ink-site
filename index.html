<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Screw_ink — Flash</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <!-- TOP ROW: NAME + LANGUAGE -->
  <div class="header-top">
    <h1>Screw_ink</h1>
    <button id="lang-toggle" class="lang-btn">FR</button>
  </div>

  <p id="subtitle">Flash available — book directly</p>

  <!-- ROW: CUSTOM PROJECTS + SOCIALS -->
  <div class="header-buttons header-row">
    <a
      href="https://tally.so/r/nrgLG5"
      target="_blank"
      class="custom-btn custom-btn--primary"
      id="customBtn"
    >
      Custom projects
    </a>

    <div class="social-links">
      <!-- Instagram -->
      <a href="https://www.instagram.com/screw_ink" target="_blank" aria-label="Instagram">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/9/95/Instagram_logo_2022.svg"
          alt="Instagram"
          class="social-icon"
        />
      </a>

      <!-- TikTok -->
      <a href="https://www.tiktok.com/@screw_ink" target="_blank" aria-label="TikTok">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/a/a9/TikTok_logo.svg"
          alt="TikTok"
          class="social-icon"
        />
      </a>
    </div>
  </div>
</header>

<main>
  <div id="flash-container" class="flash-grid"></div>
</main>

<!-- IMAGE MODAL -->
<div id="image-modal" class="modal">
  <span class="close">&times;</span>
  <img class="modal-img" id="modal-img">
</div>

<script>
  /* =========================
     LANGUAGE + TRANSLATIONS
  ========================= */
  let currentLang = "en";

  const translations = {
    en: {
      subtitle: "Flash available — book directly",
      custom: "Custom projects",
      priceNote: "Starting price — final price depends on size & placement",
      bookThis: "Book this flash",
      claimed: "CLAIMED"
    },
    fr: {
      subtitle: "Flash disponible — réservation directe",
      custom: "Projets personnalisés",
      priceNote: "Prix de départ — le prix final dépend de la taille et de l’emplacement",
      bookThis: "Réserver ce flash",
      claimed: "RÉSERVÉ"
    }
  };

  /* =========================
     LOAD FLASH
  ========================= */
  function loadFlash() {
    fetch("./flash.json")
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("flash-container");
        container.innerHTML = "";

        data.forEach(flash => {
          const isClaimed = flash.status.toLowerCase() === "claimed";

          const card = document.createElement("div");
          card.className = "flash-card";

          const img = document.createElement("img");
          img.src = `./flash/${flash.image}`;
          img.alt = flash.name;
          img.className = "flash-img";
          img.loading = "lazy";
          img.decoding = "async";

          img.addEventListener("click", () => {
            document.getElementById("modal-img").src = img.src;
            document.getElementById("image-modal").style.display = "flex";
          });

          const info = document.createElement("div");
          info.className = "flash-info";
          info.innerHTML = `
            <h3>${flash.name}</h3>

            <p class="price">${flash.price}</p>

            <p class="price-note">
              ${translations[currentLang].priceNote}
            </p>

            <p>${flash.size}</p>

            <p class="status ${isClaimed ? "claimed" : ""}">
              ${isClaimed ? translations[currentLang].claimed : ""}
            </p>

            ${
              !isClaimed
                ? `<a href="booking.html" target="_blank" class="book-btn">
                     ${translations[currentLang].bookThis}
                   </a>`
                : ""
            }
          `;

          card.appendChild(img);
          card.appendChild(info);
          container.appendChild(card);
        });
      });
  }

  loadFlash();

  /* =========================
     LANGUAGE TOGGLE
  ========================= */
  document.getElementById("lang-toggle").addEventListener("click", () => {
    currentLang = currentLang === "en" ? "fr" : "en";

    document.getElementById("lang-toggle").innerText =
      currentLang === "en" ? "FR" : "EN";

    document.getElementById("subtitle").innerText =
      translations[currentLang].subtitle;

    document.getElementById("customBtn").innerText =
      translations[currentLang].custom;

    loadFlash();
  });

  /* =========================
     MODAL CLOSE
  ========================= */
  const modal = document.getElementById("image-modal");
  const closeBtn = document.querySelector(".close");

  closeBtn.onclick = () => modal.style.display = "none";
  modal.onclick = e => {
    if (e.target === modal) modal.style.display = "none";
  };
</script>

</body>
</html>
